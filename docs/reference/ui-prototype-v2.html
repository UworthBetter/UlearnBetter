<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UlearnBetter 原型</title>
<style>
/* ====== 视觉语言：沿用 concept-graph/src/star-dive/star-dive.css 的 token ====== */
:root{
  --bg0:#040919; --bg1:#0a1536; --bg2:#13224f;
  --amber:#ffb547; --amber2:#ffd48a; --amber3:#ff9a5a; --cyan:#86dcff; --cyan2:#bfeaff;
  --ink:#f3f5ff; --ink2:rgba(230,236,255,.78); --ink3:rgba(200,212,250,.52); --ink4:rgba(200,212,250,.32);
  --line:rgba(255,222,170,.16);
  --glass:linear-gradient(150deg,rgba(46,66,128,.50),rgba(18,28,66,.44));
  --glass-b:rgba(255,222,170,.2);
  --pending:#c9b6ff;
  --font:"Inter","SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SF Mono","Fira Code",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#sky{position:fixed;inset:0;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 48%,transparent 55%,rgba(2,5,16,.55) 100%)}
#view{position:fixed;inset:0;z-index:2}
#overlay{position:fixed;inset:0;z-index:20;pointer-events:none}
#overlay>*{pointer-events:auto}

/* ---------- glass / 通用 ---------- */
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:20px;
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.09),0 0 50px rgba(255,170,70,.07)}
.eyebrow{font-size:11px;letter-spacing:.32em;color:var(--amber);font-weight:600;text-transform:uppercase}
.tag{font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,190,110,.35);color:var(--amber2);background:rgba(255,170,70,.08);white-space:nowrap}
.tag.ghost{border-color:rgba(255,255,255,.12);color:var(--ink3);background:none}
.tag.cyan{border-color:rgba(134,220,255,.45);color:var(--cyan2);background:rgba(134,220,255,.1)}
.tag.pend{border-color:rgba(201,182,255,.5);color:#e0d6ff;background:rgba(160,130,255,.12);border-style:dashed}
.tag.mock{border-color:rgba(255,140,90,.4);color:#ffd0b0;background:rgba(255,120,80,.1)}
.tag.user{border-color:rgba(134,255,190,.4);color:#c4ffe0;background:rgba(80,220,150,.1)}
.chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:999px;padding:4px 11px;font-size:12.5px;
  color:var(--ink2);transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip:hover{border-color:rgba(255,190,110,.55);color:var(--amber2);background:rgba(255,170,70,.1)}
.chip.ts{font-family:var(--mono);font-size:11.5px}
.chip.ts::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.8}
.chip.on{border-color:rgba(255,190,110,.6);color:var(--amber2);background:rgba(255,170,70,.14)}
.chip.on::after{content:"✓";font-size:11px}
.chip.on.cy{border-color:rgba(134,220,255,.6);color:var(--cyan2);background:rgba(134,220,255,.13)}
.chip.add{border-style:dashed;color:var(--ink3)}
.btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);border-radius:10px;padding:7px 14px;font-size:13px;color:var(--ink2);transition:all .2s;white-space:nowrap}
.btn:hover{border-color:rgba(255,190,110,.55);color:var(--amber2)}
.btn.pri{background:linear-gradient(180deg,rgba(255,185,80,.95),rgba(245,150,50,.95));color:#2a1700;border-color:transparent;font-weight:650}
.btn.pri:hover{color:#2a1700;filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.txt{border:0;background:none;padding:4px 6px;color:var(--ink3)}
.btn.txt:hover{color:var(--amber2)}
.sect{font-size:11px;letter-spacing:.14em;color:var(--ink3);margin:0 0 10px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bloom{0%{opacity:0;transform:scale(.6);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.18);opacity:1}}
@keyframes ringPulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-24}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.25,1) both}

/* ---------- 顶部：品牌 + 极简导航 ---------- */
.topbar{position:fixed;left:32px;right:32px;top:24px;z-index:10;display:flex;align-items:center;gap:18px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{font-size:11px;letter-spacing:.32em;color:var(--amber);font-weight:600;text-transform:uppercase;cursor:pointer}
.brand b{color:var(--ink3);font-weight:500;letter-spacing:.12em;margin-left:8px}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:rgba(10,18,44,.45);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.nav a{font-size:13px;color:var(--ink3);text-decoration:none;padding:5px 14px;border-radius:999px;cursor:pointer;transition:all .2s;position:relative}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);background:rgba(255,255,255,.08)}
.nav a .dot{position:absolute;right:6px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--pending);box-shadow:0 0 8px var(--pending)}
.sample-badge{font-size:11px;color:#ffd0b0;border:1px solid rgba(255,140,90,.35);background:rgba(255,120,80,.1);padding:3px 10px;border-radius:999px;letter-spacing:.06em}

/* ---------- 底部 Agent 栏（唯一入口） ---------- */
.agent{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));z-index:30}
.agent .bar{display:flex;align-items:center;gap:10px;height:58px;padding:0 10px 0 18px;border-radius:20px;
  background:linear-gradient(150deg,rgba(40,58,118,.72),rgba(16,26,62,.72));border:1px solid rgba(255,222,170,.24);
  backdrop-filter:blur(20px) saturate(140%);box-shadow:0 18px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1),0 0 40px rgba(255,170,70,.08);transition:border-color .3s, box-shadow .3s}
.agent .bar:focus-within{border-color:rgba(255,190,110,.55);box-shadow:0 18px 60px rgba(0,0,0,.5),0 0 0 4px rgba(255,180,80,.08),0 0 50px rgba(255,170,70,.16)}
.agent.drop .bar{border-style:dashed;border-color:rgba(255,190,110,.7);box-shadow:0 0 0 6px rgba(255,180,80,.1),0 0 80px rgba(255,170,70,.25)}
.agent .orb{width:22px;height:22px;flex:none;border-radius:50%;position:relative;
  background:radial-gradient(circle at 40% 38%,#fff 0%,var(--amber) 50%,#b8641a 100%);box-shadow:0 0 12px 2px rgba(255,180,80,.55),0 0 26px 6px rgba(255,170,70,.2)}
.agent.busy .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--amber2);animation:spin 1s linear infinite}
.agent input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:15px;font-family:var(--font);min-width:0}
.agent input::placeholder{color:var(--ink3)}
.agent .ctx{font-size:11.5px;color:var(--ink3);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 10px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.agent .ctx i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.agent .icon{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--ink2);flex:none}
.agent .icon:hover{color:var(--amber2);border-color:rgba(255,190,110,.45)}
.agent .send{background:linear-gradient(180deg,rgba(255,185,80,.95),rgba(245,150,50,.95));color:#2a1700;border-color:transparent}
.agent .send:hover{color:#2a1700}
.agent .hint{text-align:center;font-size:11px;color:var(--ink4);margin-top:7px;letter-spacing:.04em}
.agent .hint kbd{font-family:var(--mono);font-size:10.5px;border:1px solid rgba(255,255,255,.16);border-radius:4px;padding:0 5px;margin:0 2px;color:var(--ink3)}
/* agent 卡：出现在栏上方，不是聊天流 */
.agent .stack{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.nudge{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px;border-radius:16px;animation:rise .6s cubic-bezier(.2,.9,.25,1) both}
.nudge .t{flex:1;font-size:14px;line-height:1.55;color:var(--ink2)}
.nudge .t b{color:var(--ink);font-weight:600}
.nudge .t small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.nudge.compact{padding:9px 10px 9px 16px;border-radius:14px}
.nudge.compact .t{font-size:13px}
.nudge .star{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);flex:none}
.answer{padding:20px 22px 16px;border-radius:18px;animation:rise .6s cubic-bezier(.2,.9,.25,1) both;max-height:440px;overflow:auto}
.answer .q{font-size:12.5px;color:var(--ink3);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.answer .q b{color:var(--ink2);font-weight:500}
.answer p{margin:0 0 10px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.answer p b{color:var(--ink)}
.answer ol{margin:0 0 12px;padding-left:20px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.answer ol li{margin-bottom:6px}
.answer .cite{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.answer .foot{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.07);padding-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:40;padding:10px 18px;border-radius:999px;font-size:13px;color:var(--ink2);
  background:rgba(14,24,58,.85);border:1px solid rgba(134,255,190,.3);backdrop-filter:blur(10px);animation:rise .4s both;display:flex;gap:10px;align-items:center}
.toast i{width:7px;height:7px;border-radius:50%;background:#7dffb8;box-shadow:0 0 8px #7dffb8}

/* ---------- 首次使用 ---------- */
.first{position:absolute;left:50%;top:44%;translate:-50% -50%;text-align:center;width:min(640px,calc(100vw - 32px))}
.first h1{font-size:40px;font-weight:700;letter-spacing:.02em;margin:18px 0 12px}
.first p{font-size:15.5px;line-height:1.8;color:var(--ink2);margin:0 auto 26px;max-width:520px}
.first .kinds{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.first .kind{font-size:12.5px;color:var(--ink3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;min-width:132px;background:rgba(255,255,255,.02)}
.first .kind b{color:var(--ink2);font-weight:600;font-size:13.5px}
.first .kind.soon{opacity:.55}
.first .seed{width:9px;height:9px;border-radius:50%;margin:0 auto;background:var(--amber);box-shadow:0 0 14px 4px rgba(255,180,80,.5),0 0 40px 12px rgba(255,170,70,.18);animation:breathe 3s ease-in-out infinite}
.first .promise{font-size:12px;color:var(--ink3);display:flex;gap:18px;justify-content:center}
.first .promise span::before{content:"·";margin-right:6px;color:var(--amber)}

/* ---------- 整理中 ---------- */
.org{position:absolute;left:50%;top:44%;translate:-50% -50%;width:min(880px,calc(100vw - 32px));display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.org .pipe{padding:20px 20px 16px}
.pipe .it{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.pipe .it:last-child{border-bottom:0}
.pipe .it .n{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.pipe .it .n span{font-weight:400;color:var(--ink3);font-size:11.5px;font-family:var(--mono)}
.pipe .steps{display:flex;gap:4px;margin-top:8px}
.pipe .steps i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.pipe .steps i.d{background:linear-gradient(90deg,var(--amber3),var(--amber))}
.pipe .steps i.w::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--amber2),transparent);animation:slide 1.2s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pipe .idn{font-size:11.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .lbls{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink4);margin-top:5px}
.org .prop{padding:24px 26px 20px;animation:bloom .9s cubic-bezier(.2,.9,.25,1.05) both;animation-delay:.25s}
.org .prop h2{margin:10px 0 6px;font-size:24px}
.org .prop .sub{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:16px}
.goalprop{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.03)}
.goalprop .h{display:flex;align-items:center;gap:10px}
.goalprop .h input{background:none;border:0;border-bottom:1px dashed rgba(255,255,255,.2);color:var(--ink);font:inherit;font-size:16px;font-weight:650;outline:0;padding:2px 0;width:200px}
.goalprop .h input:focus{border-bottom-color:var(--amber)}
.goalprop .conf{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.goalprop .why{font-size:12.5px;color:var(--ink3);margin:6px 0 10px;line-height:1.55}
.goalprop .chips{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:10px;height:10px;border-radius:50%;flex:none}
.sw-a{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.sw-b{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.org .acts{display:flex;gap:8px;align-items:center;margin-top:14px}

/* ---------- 今天（总控台） ---------- */
.home{position:absolute;left:0;right:0;top:0;bottom:0;padding:74px 64px 0;overflow:hidden}
.home .head{display:flex;align-items:flex-end;gap:24px;margin-bottom:18px}
.home h1{margin:6px 0 4px;font-size:28px;font-weight:700;letter-spacing:.01em}
.home .meta{font-size:13px;color:var(--ink3)}
.home .meta b{color:var(--ink2);font-weight:500}
.home .rule{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right;line-height:1.6}
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.tcard{padding:18px 18px 16px;border-radius:18px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;display:flex;flex-direction:column;min-height:172px;animation:rise .6s both}
.tcard:hover{transform:translateY(-3px);border-color:rgba(255,190,110,.55);box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 36px rgba(255,170,70,.18)}
.tcard .top{display:flex;align-items:center;gap:8px}
.tcard .min{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tcard h3{margin:10px 0 2px;font-size:19px;font-weight:700;letter-spacing:.01em}
.tcard .from{font-size:12px;color:var(--ink3)}
.tcard .why{margin:9px 0 10px;font-size:13px;line-height:1.6;color:var(--ink2);flex:1}
.tcard .why::before{content:"为什么 ";color:var(--amber);font-size:11px;letter-spacing:.1em}
.tcard .bot{display:flex;gap:6px;align-items:center}
.tcard .go{margin-left:auto;font-size:12.5px;color:var(--amber2)}
.tcard.done{opacity:.5}
.goals{display:grid;grid-template-columns:1fr 1fr 330px;gap:16px}
.gcard{padding:16px 20px;border-radius:18px;display:grid;grid-template-columns:150px 1fr;gap:18px;animation:rise .7s both;animation-delay:.1s;cursor:pointer;transition:border-color .25s}
.gcard:hover{border-color:rgba(255,190,110,.5)}
.gcard .mini{height:150px;border-radius:12px;background:radial-gradient(ellipse at 50% 50%,rgba(255,180,80,.08),transparent 70%);position:relative}
.gcard.b .mini{background:radial-gradient(ellipse at 50% 50%,rgba(134,220,255,.08),transparent 70%)}
.gcard h3{margin:0 0 3px;font-size:18px;display:flex;align-items:center;gap:8px}
.gcard .intent{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.gcard .stats{display:flex;gap:16px;margin-bottom:8px}
.gcard .stats div{font-size:11px;color:var(--ink3);letter-spacing:.06em}
.gcard .stats b{display:block;font-family:var(--mono);font-size:18px;color:var(--ink);font-weight:600;letter-spacing:0}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.08);display:flex;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%}
.prog .r{background:var(--amber)} .prog .l{background:rgba(255,190,110,.4)}
.gcard.b .prog .r{background:var(--cyan)} .gcard.b .prog .l{background:rgba(134,220,255,.4)}
.gcard .topics{display:flex;flex-direction:column;gap:3px}
.gcard .topics div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.gcard .topics div span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.trail{padding:16px 20px;border-radius:18px;animation:rise .7s both;animation-delay:.2s}
.trail ul{list-style:none;margin:0;padding:0;position:relative}
.trail ul::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.1)}
.trail li{position:relative;padding:0 0 7px 20px;font-size:12.5px;color:var(--ink2);line-height:1.45}
.trail li::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:#0d1838;border:1.5px solid var(--amber)}
.trail li.f::before{border-color:#ff8a7a}
.trail li.q::before{border-color:var(--cyan)}
.trail li small{display:block;color:var(--ink3);font-size:11px}

/* ---------- 星图（总览 + 潜航） ---------- */
.sky-layer{position:absolute;inset:0}
.sky-layer svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.st{position:absolute;width:0;height:0;cursor:pointer;transition:opacity .5s,filter .5s}
.st .hit{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%}
.st .halo,.st .core{opacity:var(--a,1)}
.st .halo{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow) 0%,transparent 68%);animation:breathe 5s ease-in-out infinite;animation-delay:var(--d)}
.st .core{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 40% 38%,#fff 0%,var(--c) 55%,var(--deep) 100%);box-shadow:0 0 10px 2px var(--glow)}
.st .lab{position:absolute;top:14px;left:0;transform:translateX(-50%);white-space:nowrap;text-align:center;pointer-events:none}
.st .lab b{display:block;font-weight:600;font-size:12.5px;color:rgba(246,240,228,.9);text-shadow:0 0 10px rgba(4,9,25,.95)}
.st .lab i{display:block;font-style:normal;font-size:10px;color:var(--ink3);letter-spacing:.05em;text-shadow:0 0 8px rgba(4,9,25,.95)}
.st.big .lab{top:20px}.st.big .lab b{font-size:14px}
.st:hover .lab b{color:var(--amber2)}
.st .pring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--pending);opacity:.9;animation:spin 9s linear infinite}
.st .rring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,190,100,.8);animation:ringPulse 2.2s ease-out infinite}
.st.dim{opacity:.18;filter:saturate(.4)}
.st.dim .lab{opacity:0}
.const-label{position:absolute;transform:translate(-50%,0);padding:7px 14px 7px 12px;border-radius:999px;font-size:13px;white-space:nowrap;display:flex;gap:10px;align-items:center;cursor:pointer;
  background:rgba(14,24,58,.6);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);transition:border-color .2s}
.const-label:hover{border-color:rgba(255,190,110,.55)}
.const-label b{font-weight:600}
.const-label span{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.const-label.pend{border:1px dashed rgba(201,182,255,.6)}
.goal-name{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.goal-name .eyebrow{font-size:10.5px}
.goal-name h2{margin:4px 0 0;font-size:28px;font-weight:300;letter-spacing:.24em;color:rgba(255,232,200,.42)}
.goal-name.b .eyebrow{color:var(--cyan)}
.goal-name.b h2{color:rgba(190,234,255,.42)}
.map-legend{position:fixed;right:40px;bottom:166px;z-index:6;display:flex;flex-direction:column;gap:8px;font-size:11.5px;color:var(--ink3);padding:12px 14px;border-radius:12px;background:rgba(10,18,44,.35);border:1px solid rgba(255,255,255,.06)}
.map-legend span{min-height:14px}
.map-legend span{display:flex;align-items:center;gap:6px}
.map-legend em{display:inline-block;border-radius:50%}
.hud{position:fixed;z-index:6;left:32px;top:62px;pointer-events:none}
.hud h1{margin:6px 0 4px;font-size:22px;font-weight:650}
.hud .meta{font-size:12.5px;color:var(--ink3)}
.hud .crumb{font-size:11px;letter-spacing:.2em;color:var(--amber);font-weight:600}
.hud .crumb a{color:var(--ink3);pointer-events:auto;cursor:pointer;text-decoration:none}
.hud .crumb a:hover{color:var(--amber2)}
.unassigned{position:fixed;right:40px;bottom:116px;z-index:6;font-size:12px;color:var(--ink3);border:1px dashed rgba(255,255,255,.15);border-radius:12px;padding:8px 14px}
/* 潜航：主卡 + 环绕卡 */
.focus-dim{position:absolute;inset:0;background:radial-gradient(ellipse 52% 48% at 50% 46%,rgba(6,12,34,.66),transparent 75%);pointer-events:none}
.main-card{position:absolute;left:50%;top:44%;width:410px;transform:translate(-50%,-50%)}
.main-card .inner{padding:22px 26px 20px;animation:bloom .9s cubic-bezier(.2,.9,.25,1.05) both}
.main-card h2{margin:12px 0 2px;font-size:26px;font-weight:700;letter-spacing:.02em}
.main-card .en{font-size:13px;color:var(--ink3);letter-spacing:.05em}
.main-card p.sum{margin:12px 0 14px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.main-card .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mc-foot{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.07);padding-top:12px;margin-top:6px;font-size:12px;color:var(--ink3)}
.mastery{display:flex;gap:3px}
.mastery i{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.mastery i.on{background:var(--amber);box-shadow:0 0 6px rgba(255,180,80,.5)}
.orbit-card{position:absolute;width:186px;min-height:92px;padding:14px 15px 13px;border-radius:16px;cursor:pointer;animation:bloom .9s cubic-bezier(.2,.9,.25,1.1) both;translate:-50% -50%}
.orbit-card:hover{border-color:rgba(255,190,110,.6)}
.oc-top{display:flex;align-items:center;gap:9px}
.oc-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,181,71,.16);color:var(--amber2);font-size:14px}
.oc-act{font-size:15px;font-weight:650;letter-spacing:.03em}
.oc-title{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.45}
.timeline{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));z-index:5}
.tl-bar{position:relative;height:20px}
.tl-seg{position:absolute;top:8px;height:3px;border-radius:2px;background:rgba(160,180,240,.18)}
.tl-dot{position:absolute;top:5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:rgba(255,230,190,.55);box-shadow:0 0 6px rgba(255,200,120,.5)}
.tl-dot.on{background:var(--amber);transform:scale(1.35)}
.tl-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.back-btn{position:fixed;left:32px;bottom:32px;z-index:31;background:rgba(20,30,66,.55);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;font-size:13px;backdrop-filter:blur(10px);color:var(--ink2)}
.back-btn:hover{color:var(--amber2);border-color:rgba(255,190,110,.4)}
/* 离星回忆 */
.recall{position:absolute;width:360px;padding:18px 20px 16px;border-radius:18px;animation:bloom .7s cubic-bezier(.2,.9,.25,1.05) both}
.recall::before{content:"";position:absolute;left:-7px;top:30px;width:12px;height:12px;transform:rotate(45deg);background:rgba(40,58,118,.8);border-left:1px solid var(--glass-b);border-bottom:1px solid var(--glass-b)}
.recall .q{font-size:15px;line-height:1.65;margin:10px 0 14px}
.recall .opts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.recall .opt{text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--ink2);transition:all .2s}
.recall .opt:hover{border-color:rgba(255,190,110,.55);color:var(--amber2)}
.recall .opt.ok{border-color:rgba(125,255,184,.6);color:#c4ffe0;background:rgba(80,220,150,.1)}
.recall .alt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3);white-space:nowrap}

/* ---------- 调整归类（提议卡片组） ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,7,20,.55);backdrop-filter:blur(3px);z-index:19;animation:rise .3s both}
.sheet{position:fixed;left:50%;top:28px;translate:-50% 0;width:min(820px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;padding:24px 26px 20px;z-index:21;animation:bloom .6s cubic-bezier(.2,.9,.25,1.05) both}
.sheet::-webkit-scrollbar{width:8px}.sheet::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.sheet .h{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.sheet h2{margin:6px 0 4px;font-size:22px}
.sheet .src{font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:18px;line-height:1;color:var(--ink2);flex:none}
.x:hover{color:var(--amber2);border-color:rgba(255,190,110,.5)}
.chg{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.03);display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.chg.hot{border-color:rgba(201,182,255,.45);background:rgba(160,130,255,.06)}
.chg .what{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chg .what .arrow{color:var(--ink3);font-weight:400}
.chg .why{grid-column:1/2;font-size:12.5px;color:var(--ink3);line-height:1.6}
.chg .why q{color:var(--ink2);quotes:"「" "」"}
.chg .goalsel{grid-column:1/2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chg .goalsel small{font-size:11px;color:var(--ink3);margin-right:4px}
.chg .side{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.conf{font-family:var(--mono);font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.conf .bar{width:54px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--amber)}
.chg .acts{display:flex;gap:6px}
.chg.done{opacity:.55}
.sheet .foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.sheet .foot .note{font-size:12px;color:var(--ink3);flex:1;line-height:1.5}

/* ---------- v1 笔记抽屉样式（v2 起并入「资料」，.seg / .pin 仍在用） ---------- */
body.with-rail .agent{left:calc((100vw - 380px)/2);width:min(700px,calc(100vw - 412px))}
body.with-drawer .agent{left:calc((100vw - 572px)/2);width:min(660px,calc(100vw - 604px))}
.drawer{position:fixed;right:16px;top:16px;bottom:16px;width:540px;z-index:21;padding:22px 22px 18px;display:flex;flex-direction:column;animation:drawerIn .45s cubic-bezier(.2,.9,.25,1) both}
@keyframes drawerIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.drawer .h{display:flex;align-items:flex-start;gap:12px}
.drawer h2{margin:6px 0 4px;font-size:21px}
.drawer .sub{font-size:12.5px;color:var(--ink3);line-height:1.55}
.seg{display:flex;gap:4px;margin:14px 0 12px;padding:3px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.06);width:max-content}
.seg a{font-size:12.5px;color:var(--ink3);padding:5px 12px;border-radius:8px;cursor:pointer}
.seg a.on{background:rgba(255,255,255,.09);color:var(--ink)}
.seg a em{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--pending)}
.tree{flex:1;overflow:auto;margin:0 -8px;padding:0 8px}
.tree::-webkit-scrollbar{width:6px}.tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.tg{margin-bottom:14px}
.tg-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;color:var(--ink3);margin:4px 0 8px}
.tg-h b{color:var(--ink2);letter-spacing:.04em;font-size:13px}
.tp{border:1px solid rgba(255,255,255,.08);border-radius:14px;margin-bottom:8px;background:rgba(255,255,255,.03)}
.tp.open{border-color:rgba(255,190,110,.35)}
.tp-row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.tp-row .car{color:var(--ink3);font-size:10px;width:10px;transition:transform .2s}
.tp.open .tp-row .car{transform:rotate(90deg)}
.tp-row .nm{font-size:14px;font-weight:600}
.tp-row .nm small{display:block;font-weight:400;font-size:11px;color:var(--ink3);margin-top:1px}
.tp-row .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.tp-body{padding:0 14px 12px 34px}
.tp-goals{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:11.5px;color:var(--ink3)}
.cr{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--ink2)}
.cr:hover{background:rgba(255,255,255,.04)}
.cr .md{width:8px;height:8px;border-radius:50%;flex:none}
.cr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .nm small{color:var(--ink3);font-size:11px;margin-left:6px}
.cr .imp{display:flex;gap:2px;cursor:pointer}
.cr .imp i{font-style:normal;font-size:12px;color:rgba(255,255,255,.18)}
.cr .imp i.on{color:var(--amber)}
.cr .ia{display:flex;gap:2px;opacity:.0;transition:opacity .2s}
.cr:hover .ia,.cr.hl .ia{opacity:1}
.cr .ia button{border:0;background:none;color:var(--ink3);font-size:12px;padding:2px 6px;border-radius:6px}
.cr .ia button:hover{color:var(--amber2);background:rgba(255,255,255,.06)}
.cr.hidden .nm{text-decoration:line-through;opacity:.5}
.cr.hl{background:rgba(255,170,70,.07)}
.pin{font-size:10.5px;color:#c4ffe0;border:1px solid rgba(134,255,190,.35);border-radius:6px;padding:0 5px;flex:none}
.drawer .foot{border-top:1px solid rgba(255,255,255,.07);padding-top:12px;margin-top:8px;font-size:12px;color:var(--ink3);line-height:1.6}
.drawer .foot b{color:var(--ink2);font-weight:500}


/* ================= v2：统计条 / 学习统计层 ================= */
.kstrip{margin-left:auto;display:flex;align-items:center;gap:20px;padding:12px 18px;border-radius:16px;cursor:pointer;transition:border-color .25s}
.kstrip:hover{border-color:rgba(255,190,110,.55)}
.kstrip .k{font-size:11px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap}
.kstrip .k b{display:block;font-family:var(--mono);font-size:18px;color:var(--ink);font-weight:600;letter-spacing:0}
.kstrip .k b small{font-size:11px;color:var(--ink3);margin-left:2px;font-weight:400}
.kstrip .heat{display:flex;gap:3px;align-items:flex-end}
.kstrip .heat i{width:10px;height:10px}
.kstrip .heatwrap{font-size:10.5px;color:var(--ink3);display:flex;flex-direction:column;gap:5px;letter-spacing:.04em}
.kstrip .go{font-size:12.5px;color:var(--amber2);white-space:nowrap}
.hc{display:block;border-radius:2px;background:rgba(255,255,255,.06)}
.hc.l1{background:rgba(255,181,71,.28)}.hc.l2{background:rgba(255,181,71,.5)}.hc.l3{background:rgba(255,181,71,.75)}.hc.l4{background:#ffb547}
.hc.pre{background:none;outline:1px dashed rgba(255,255,255,.1);outline-offset:-1px}
.hc.fut{background:none}
.stats-sheet{width:min(1060px,calc(100vw - 32px))}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.kpi .l{font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;margin:3px 0 1px}
.kpi b small{font-size:13px;color:var(--ink3);font-weight:400}
.kpi .d{font-size:11.5px;color:var(--ink3)}
.srow{display:grid;gap:12px;margin-bottom:12px}
.pnl{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);min-width:0}
.pnl .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pnl .ph h4{margin:0;font-size:13.5px;font-weight:600}
.pnl .ph span{font-size:11.5px;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-left:auto}
.lgd i{display:inline-block;width:12px;height:2px;border-radius:1px;vertical-align:middle;margin-right:5px}
.heatgrid{display:grid;grid-template-columns:18px repeat(5,26px);grid-template-rows:14px repeat(7,20px);gap:4px;font-size:10.5px;color:var(--ink3)}
.heatgrid .hc{border-radius:4px}
.heatgrid .hc:not(.fut):hover{outline:1.5px solid var(--amber2);outline-offset:0}
.heatlgd{display:flex;gap:4px;align-items:center;font-size:10.5px;color:var(--ink3);margin-top:10px}
.heatlgd .hc{width:12px;height:12px;border-radius:3px}
.chart rect.hov{fill:transparent;cursor:crosshair}
.chart rect.hov:hover{fill:rgba(255,255,255,.05)}
.hbar{display:grid;grid-template-columns:104px 1fr 64px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.hbar .t{height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:4px;background:#c4801f}
.hbar span{font-family:var(--mono);font-size:11.5px;color:var(--ink3);text-align:right}
.mini-list{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--ink2)}
.mini-list li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:baseline}
.mini-list li:last-child{border-bottom:0}
.mini-list li small{margin-left:auto;color:var(--ink3);font-size:11px;white-space:nowrap}
.dtable{width:100%;border-collapse:collapse;font-size:12px;color:var(--ink2)}
.dtable th,.dtable td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);text-align:right;font-family:var(--mono)}
.dtable th:first-child,.dtable td:first-child{text-align:left;font-family:var(--font)}
.dtable th{color:var(--ink3);font-weight:500;font-family:var(--font)}

/* 今天：智能体整理卡 */
.arow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.arow:last-child{border-bottom:0}
.arow .aic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none;font-size:11px;color:var(--ink2)}
.arow .an{min-width:0;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .an small{display:block;font-size:11px;color:var(--ink3)}
.arow .an small.pend{color:#e0d6ff}.arow .an small.run{color:var(--amber2)}

/* ================= v2：资料（智能体整理收件箱 + 修正层） ================= */
.lib{position:absolute;inset:0;padding:74px 64px 0}
.lib .head{display:flex;align-items:flex-end;gap:20px;margin-bottom:14px}
.lib h1{margin:6px 0 4px;font-size:28px}
.lib .meta{font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lib .meta b{color:var(--ink2);font-weight:500}
.lib .filters{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.lib .filters .seg{margin:0}
.lib-body{display:grid;grid-template-columns:520px 1fr;gap:16px;height:calc(100vh - 74px - 92px - 124px)}
.lib-list{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:3px 12px;padding:12px 14px;border-radius:14px;cursor:pointer;background:rgba(20,32,74,.5);border:1px solid rgba(255,255,255,.08);transition:border-color .2s;backdrop-filter:blur(10px)}
.mrow:hover{border-color:rgba(255,190,110,.4)}
.mrow.on{border-color:rgba(255,190,110,.6);background:rgba(46,66,128,.55)}
.mrow .ic{grid-row:1/4;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--ink2);font-size:14px}
.mrow .tt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .id{grid-column:2/4;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .id b{color:var(--ink2);font-weight:500}
.mrow .gl{grid-column:2/4;display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.stp{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;height:20px}
.stp.run{color:var(--amber2);border:1px solid rgba(255,190,110,.4)}
.stp.run::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,212,138,.3);border-top-color:var(--amber2);animation:spin 1s linear infinite}
.stp.pend{color:#e0d6ff;border:1px dashed rgba(201,182,255,.55);background:rgba(160,130,255,.1)}
.stp.done{color:var(--ink3);border:1px solid rgba(255,255,255,.12)}
.gdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.lib-detail{overflow:auto;padding:20px 22px;border-radius:18px}
.lib-detail::-webkit-scrollbar{width:8px}.lib-detail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.lib-detail h2{margin:8px 0 4px;font-size:22px}
.lib-detail .src{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.blk{margin-bottom:18px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 12px;font-size:13px;line-height:1.6;margin:0}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;color:var(--ink2)}
.flow{display:flex;align-items:flex-start;max-width:560px}
.flow .s{flex:1;position:relative;text-align:center;font-size:11.5px;color:var(--ink3)}
.flow .s::before{content:"";position:absolute;top:7px;left:-50%;right:50%;height:2px;background:rgba(255,255,255,.1)}
.flow .s:first-child::before{display:none}
.flow .s i{position:relative;z-index:1;display:block;width:16px;height:16px;margin:0 auto 6px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:#0d1838}
.flow .s.d i{border-color:var(--amber);background:#3a2608}
.flow .s.d::before{background:linear-gradient(90deg,var(--amber3),var(--amber))}
.flow .s.p i{border:2px dashed var(--pending);background:rgba(160,130,255,.15)}
.flow .s.w i{border-color:var(--amber2);border-top-color:transparent;animation:spin 1s linear infinite}
.flow .s.x{opacity:.45}
.flow .s b{display:block;color:var(--ink2);font-weight:500}
.asg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.asg small{font-size:11.5px;color:var(--ink3)}

function drawSky(){

}

function starHTML({x,y,label,sub,imp=2,m=1,col='amber',pending=false,ring=false,big=false,cls='',d=0,on=''}){

    ${pending?'<div class="pring"></div>':''}${ring?'<div class="rring"></div>':''}
    <div class="hit"></div>${label?`<div class="lab"><b>${esc(label)}</b>${sub?`<i>${esc(sub)}</i>`:''}</div>`:''}</div>`;
}
function constellation(topic,cx,cy,rx,ry,seed,col){
  const r=rng(seed),pts=[];
  topic.concepts.forEach((c,i)=>{let px,py,tries=0;
    do{const a=r()*Math.PI*2,d=Math.sqrt(r());px=cx+Math.cos(a)*rx*d;py=cy+Math.sin(a)*ry*d;tries++}
    while(tries<40&&pts.some(p=>Math.hypot(p.x-px,p.y-py)<46));
    pts.push({x:px,y:py,c})});
  const links=[];pts.forEach((p,i)=>{const near=pts.map((q,j)=>({j,d:Math.hypot(p.x-q.x,p.y-q.y)})).filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,1+(i%2));
    near.forEach(o=>{if(!links.some(l=>(l[0]===o.j&&l[1]===i)))links.push([i,o.j])})});
  return {pts,links,col};
}

// 按主题内分组布星：同一组的星聚在一起，缺口才看得出来
function constellationG(topic,cx,cy,rx,ry,seed){
  const r=rng(seed),gs=GROUPS[topic.id],k=gs.length,pts=[],centers=[];const off=r()*Math.PI*2;
  gs.forEach(([name,n],gi)=>{const th=off+gi*2*Math.PI/k;centers.push({x:cx+Math.cos(th)*rx*.56,y:cy+Math.sin(th)*ry*.56,name,n})});
  topic.concepts.forEach((c,i)=>{const g=centers[c.grp];let px,py,t=0;
    do{const a=r()*Math.PI*2,d=Math.sqrt(r());px=g.x+Math.cos(a)*rx*.38*d;py=g.y+Math.sin(a)*ry*.38*d;t++}
    while(t<80&&pts.some(p=>Math.hypot(p.x-px,p.y-py)<34));
    pts.push({x:px,y:py,c,i})});
  const links=[],dist=(u,v)=>Math.hypot(u.x-v.x,u.y-v.y);
  centers.forEach((g,gi)=>{const ps=pts.filter(p=>p.c.grp===gi);for(let a=1;a<ps.length;a++){const prev=ps.slice(0,a).sort((u,v)=>dist(u,ps[a])-dist(v,ps[a]))[0];links.push([prev.i,ps[a].i])}});
  for(let gi=1;gi<k;gi++){let best=null;pts.filter(p=>p.c.grp===gi).forEach(p=>pts.filter(q=>q.c.grp===gi-1).forEach(q=>{const d=dist(p,q);if(!best||d<best.d)best={d,a:p.i,b:q.i}}));if(best)links.push([best.a,best.b])}
  return {pts,links,centers,rx,ry};
}

SCREENS.stats=()=>{

  const start=new Date(2026,9,5),first=new Date(2026,9,30),today=new Date(2026,10,7),cells=[];
  for(let w=0;w<5;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);
    const key=String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),lab=`${dt.getMonth()+1}月${dt.getDate()}日`;
    let cls,tt;if(dt<first){cls='pre';tt=lab+' · 还没开始使用'}else if(dt>today){cls='fut';tt=''}else{cls=heatLevel(MINS[key]);tt=`${lab} · ${MINS[key]} 分钟`}
    cells.push(`<i class="hc ${cls}" style="grid-column:${w+2};grid-row:${d+2}" ${tt?`title="${tt}"`:''}></i>`)}
  const heat=`<div class="heatgrid">${['10/5','10/12','10/19','10/26','11/2'].map((l,w)=>`<span style="grid-column:${w+2};grid-row:1">${l}</span>`).join('')}
    ${['一','','三','','五','','日'].map((l,d)=>`<span style="grid-column:1;grid-row:${d+2};line-height:20px">${l}</span>`).join('')}${cells.join('')}</div>

  const xl=[0,2,4,6,8].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="rgba(200,212,250,.52)">${DAYS[i].replace(/^0?(\d+)-0?(\d+)$/,'$1/$2')}</text>`).join('');

  const rows=MATERIALS.map(m=>{const st=mstat(m);return `<div class="mrow ${m.id===sel.id?'on':''}" onclick="state.libSel='${m.id}';render()">
      <span class="ic">${m.ic}</span><span class="tt">${esc(m.title)}</span><span class="stp ${st}">${STLAB[st]}</span>
      <span class="id">识别为 <b>${KIND[m.kind]}</b> · ${esc(m.ident)}</span>
      <span class="gl">${gdots(m)}<span>·</span><span>${m.topic?TOPICS[m.topic].concepts.length+' 个概念':m.conText}</span><span style="margin-left:auto">${m.at}</span></span></div>`}).join('');
  return `${topbar('library')}
  <div class="lib">
    <div class="head"><div><div class="eyebrow">资料 · 智能体整理</div><h1>你丢进来的 ${MATERIALS.length} 份资料</h1>
      <div class="meta">已整理 <b>${cnt('done')}</b> · 整理中 <b>${cnt('run')}</b> · 待确认 <b>${cnt('pend')}</b> · 整理组件 mock-organizer v0 <span class="tag mock">模拟，未调用真实模型</span></div></div>
      <div class="filters"><div class="seg"><a class="on">全部 ${MATERIALS.length}</a><a>整理中 ${cnt('run')}</a><a>待确认 <em>${cnt('pend')}</em></a><a>已整理 ${cnt('done')}</a></div>
        <div class="seg"><a class="on">全部类型</a><a>视频 1</a><a>课程笔记 3</a><a>想法 1</a><a>文章 0</a></div></div></div>
    <div class="lib-body"><div class="lib-list">${rows}</div><div class="lib-detail glass">${libDetail(sel)}</div></div>
  </div>
  ${state.toast?`<div class="toast"><i></i>${esc(state.toast)}</div>`:''}
  ${agentBar({ctx:'资料 · '+short(sel.title).slice(0,10), placeholder:'丢新资料，或问「这份讲了什么」…'})}`;
};
SCREENS.notes=()=>SCREENS.library(); // v1 的「笔记」抽屉并入「资料」

function libDetail(m){
  const st=mstat(m);
  const flow=steps=>`<div class="flow">${steps.map(([l,c,cap])=>`<div class="s ${c}"><i></i><b>${l}</b>${cap||''}</div>`).join('')}</div>`;
  const kv=`<dl class="kv">${IDENT[m.id].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  let proc,asg,con,foot;
  if(m.id==='v1'){
    proc=flow([['读取','d','字幕已下载'],['识别','d','视频课 · 中文'],['抽概念','w','进行中'],['归类','',''],['编译星图','','']]);
    asg=`<div class="asg"><span class="chip">量化交易</span><small>预计归入 · 整理完再请你确认</small></div>`;
    con=`<div class="hint2">抽取中。抽出来的概念会先和已有的星比对：同名的只标候选，不自动合并。</div>`;
    foot=`<button class="btn sm">停止整理</button><button class="btn sm">打开视频 ↗</button>`;
  }else if(m.id==='i1'){
    proc=flow([['读取','d','一句话'],['识别','d','疑问'],['抽概念','x','不适用'],['挂接',st==='pend'?'p':'d',st==='pend'?'待确认':'已挂上'],['编译星图','x','不适用']]);
    asg=`<div class="asg"><small>挂到哪颗星（单选）</small><span class="chip on">抵扣价 · 双均线 · 0.82</span><span class="chip">关键性波动 · 趋势交易 · 0.41</span><span class="chip add">＋ 其他星</span>
      <span class="why">理由：问题里直接出现「抵扣价」和「均线拐头」，双均线笔记 ch03 讲的正是这件事。</span></div>
      ${st==='pend'?`<div class="asg"><button class="btn sm pri" onclick="state.ideaDone=true;toast('已挂到「抵扣价」· 下次潜航能在「我的思考」里看到');render()">挂上去</button><button class="btn sm">先不挂</button></div>`:''}`;
    con='';
    foot=`<button class="btn sm" onclick="go('#dive')">去这颗星</button><button class="btn sm txt">删除</button>`;
  }else{
    const t=TOPICS[m.topic],gs=goalsOf(m.topic),pend=st==='pend';
    const tog=id=>`state.aiGoals=state.aiGoals.includes('${id}')?state.aiGoals.filter(x=>x!=='${id}'):[...state.aiGoals,'${id}'];render()`;
    proc=flow([['读取','d',''],['识别','d','课程笔记'],['抽概念','d',t.concepts.length+' 个'],['归类',pend?'p':'d',pend?'待确认':'已接受'],['编译星图','d','已上星图']]);
    asg=`<div class="asg"><small>属于（可多选）</small>${['a','b'].map(g=>`<span class="chip ${gs.includes(g)?'on'+(g==='b'?' cy':''):''}" ${m.topic==='ai'?`onclick="${tog(g)}"`:''}>${GOALS[g].title}</span>`).join('')}<span class="chip add">＋ 新目标</span>
      <span class="conf" style="margin-left:auto">置信 ${t.conf.toFixed(2)}<span class="bar"><i style="width:${t.conf*100}%"></i></span></span>
      <span class="why">${m.topic==='ai'?'理由：课程主体是用 Claude Code + MCP 搭系统，但第三、四阶段整段在讲回测与风控。':'高于自动接受阈值 0.85，已自动接受；随时可以改。'}</span></div>
      ${pend?`<div class="asg"><button class="btn sm pri" onclick="state.adjusted=true;toast('已保存到你的决定 · 重新整理不会覆盖');render()">按这样保存</button><button class="btn sm" onclick="go('#adjust')">看这次整理的全部 4 处</button></div>`:''}`;
    const dotc=x=>['rgba(255,255,255,.2)','rgba(255,190,110,.5)','#ffc469','#ffe2a8'][x];
    con=`<div class="hint2">点概念可以改名、隐藏、改归属或置顶重要性。改过的标「你改过」，重新整理也保留；原笔记不动。</div>
      ${GROUPS[m.topic].map(([g],gi)=>`<div class="cgrp"><small>${g}</small>${t.concepts.filter(c=>c.grp===gi).map(c=>`<span class="cchip" title="${['未学','看过','回忆过','已掌握'][c.m]} · 重要性 ${c.imp}"><i style="background:${dotc(c.m)};box-shadow:0 0 ${c.m*3}px ${dotc(c.m)}"></i>${esc(c.n)}${c.pin?' <span class="pin">你置顶</span>':''}</span>`).join('')}</div>`).join('')}`;
    foot=`<button class="btn sm" onclick="go('#panorama')">在全景中看</button><button class="btn sm" onclick="go('#dive')">潜航学习</button><button class="btn sm">打开原笔记 ↗</button><button class="btn sm txt" style="margin-left:auto">重新整理</button><button class="btn sm txt">撤销这次整理</button>`;
  }
  return `<div style="display:flex;gap:8px;align-items:center"><span class="tag ghost">${KIND[m.kind]}</span><span class="stp ${st}">${STLAB[st]}</span><span class="muted" style="margin-left:auto;font-size:12px">${m.at} 丢进来</span></div>
    <h2>${esc(m.title)}</h2><div class="src">${esc(m.src)}</div>
    <div class="blk"><div class="sect">智能体识别</div>${kv}</div>
    <div class="blk"><div class="sect">整理过程</div>${proc}</div>
    <div class="blk"><div class="sect">${m.id==='i1'?'挂接':'归属'}</div>${asg}</div>
    ${con?`<div class="blk"><div class="sect">抽出的概念 · ${m.topic?TOPICS[m.topic].concepts.length:''}</div>${con}</div>`:''}
    <div class="dfoot">${foot}</div>`;
}

SCREENS.ask=()=>{
  const q=state.answerQ||'为什么今天先复习抵扣价？';
  const ans=`<div class="answer glass">
    <div class="q"><span class="tag ghost">你问</span><b>${esc(q)}</b><span class="tag mock" style="margin-left:auto">模拟回答 · 未调用真实模型</span></div>
    <p>今天的计划把它排第一，依据只有两条，都来自你的学习记录：</p>
    <ol><li><b>到期了。</b>11月4日离开这颗星时，回忆选了「忘了」，按间隔规则今天到期。</li>
      <li><b>它挡在下一颗前面。</b>今天第 2 件是「关键性波动」，它的判断依据之一是均线会不会拐头，而那由抵扣价决定。</li></ol>
    <p style="font-size:13px;color:var(--ink3)">第 2 条是笔记里写明的关联（趋势交易 ch08），不是我推出来的前置关系。</p>
    <div class="cite"><span class="chip">今日计划 · 第 1 条</span><span class="chip">回忆记录 11月4日</span><span class="chip ts">7:46</span></div>
    <div class="foot"><button class="btn sm pri" onclick="go('#dive')">现在去复习</button><button class="btn sm">今天先跳过</button><button class="btn sm txt" style="margin-left:auto" onclick="go('#home')">收起</button></div>
  </div>`;
  return `${SCREENS.home().replace(/<div class="agent[\s\S]*$/,'')}
  <div class="scrim" style="background:rgba(3,7,20,.35);backdrop-filter:none" onclick="go('#home')"></div>
  ${agentBar({ctx:'今天', stack:ans, placeholder:'继续问…'})}`;
};

// ---------- 路由 ----------
const ORDER=[['first','01 首次使用'],['organizing','02 整理中 · 目标提议'],['home','03 今天（总控台）'],['stats','04 学习统计'],['library','05 资料 · 智能体整理'],['adjust','06 调整归类'],['panorama','07 学习全景图'],['dive','08 星图潜航'],['recall','09 离星回忆'],['ask','10 助手回答']];
function go(h){location.hash=h}
function render(){
  const k=(location.hash||'#first').slice(1);const f=SCREENS[k]||SCREENS.first;
  state.overlay=['adjust','ask','stats'].includes(k);document.body.classList.toggle('with-rail',['map','panorama'].includes(k));
  $('#view').innerHTML=f();
  $('#overlay').innerHTML=`<div class="proto-nav" id="pn"><b>原型页面 · 示例数据</b>${ORDER.map(([id,n])=>`<a href="#${id}" class="${id===k?'on':''}">${n}</a>`).join('')}</div>`;
  if(k==='ask'){const i=$('#agentInput');i&&i.setAttribute('value','')}
}
addEventListener('hashchange',render);
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();const i=$('#agentInput');i&&i.focus()}
  if(e.key==='Escape'){const k=location.hash.slice(1);if(k==='adjust')go('#panorama');else if(['ask','stats'].includes(k))go('#home');else if(['dive','recall'].includes(k))go('#panorama')}});
if(/shot/.test(location.search))document.body.classList.add('shot');
drawSky();render();
</script>
</body>
</html>
