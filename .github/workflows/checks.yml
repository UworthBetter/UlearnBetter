name: Checks

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: concept-graph/package-lock.json
      - run: npm ci
        working-directory: concept-graph
      - run: npm run build
        working-directory: concept-graph
      - run: npm run lint
        working-directory: concept-graph
      - run: node --experimental-strip-types --test tests/assistant-context.test.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests
