name: Checks

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: concept-graph/package-lock.json
      - run: npm ci
        working-directory: concept-graph
      - run: npm run build
        working-directory: concept-graph
      - run: npm run lint
        working-directory: concept-graph
      - run: node --experimental-strip-types --test tests/assistant-context.test.mjs tests/assistant-interaction.test.mjs tests/assistant-pet.test.mjs tests/learn-adapter.test.mjs tests/record-*.test.mjs
      - run: node --experimental-strip-types --test tests/ui-*.test.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "jsonschema>=4,<5"
      - run: python -m unittest discover -s tests
      - run: python tools/learning/notes_compile.py samples/learn/demo-topic --out "${{ runner.temp }}/learn-check" --extractor annotated --schema-file schemas/learning/learn.schema.json
      - name: Folder organizer conformance
        run: |
          python tools/learning/organize.py --request samples/record/organize/request.json --organizer folder --out "${{ runner.temp }}/organize-check.json"
          python -c "import json; from pathlib import Path; assert json.loads(Path('${{ runner.temp }}/organize-check.json').read_text(encoding='utf-8')) == json.loads(Path('samples/record/organize/folder.expected.json').read_text(encoding='utf-8'))"
  backend:
    runs-on: ubuntu-latest
    env:
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
